name: Build and Release Körün Portable

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-portable:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libreoffice
          sudo gem install --no-document fpm

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller PyQt6 Pillow PyMuPDF python-docx openpyxl odfpy requests

      - name: Compiler avec PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "korun-portable" src/main.py

      - name: Créer l'archive Linux Portable (.tar.gz)
        run: |
          tar -czvf korun-v0.1.6-linux-portable.tar.gz -C dist/korun-portable .

      - name: Uploader l'archive Linux Portable vers GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: korun-v0.1.6-linux-portable.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller PyQt6 Pillow PyMuPDF python-docx openpyxl odfpy requests

      - name: Compiler l'exécutable Windows Portable
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Korun-v0.1.6-Windows-Portable" src/main.py

      - name: Uploader l'exécutable Windows Portable vers GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Korun-v0.1.6-Windows-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
