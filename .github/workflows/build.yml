name: Build and Release Körün (v0.1.8)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm libreoffice
          sudo gem install --no-document fpm

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller PyQt6 Pillow PyMuPDF python-docx openpyxl odfpy requests

      - name: Compiler avec PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "korun" src/main.py

      - name: Créer l'archive Linux Portable (.tar.gz)
        run: |
          tar -czvf korun-v0.1.8-linux-portable.tar.gz -C dist/korun .

      - name: Structurer le paquet Linux (.deb et .rpm)
        run: |
          mkdir -p package_root/usr/bin
          mkdir -p package_root/usr/share/applications
          mkdir -p package_root/opt/korun
          cp -r dist/korun/* package_root/opt/korun/
          ln -s /opt/korun/korun package_root/usr/bin/korun
          cat <<EOT > package_root/usr/share/applications/korun.desktop
          [Desktop Entry]
          Name=Körün
          Comment=Gestionnaire de fichiers double panneau avec aperçu Office/PDF
          Exec=/usr/bin/korun
          Terminal=false
          Type=Application
          Categories=Utility;FileManager;
          EOT

      - name: Générer le paquet .deb
        run: |
          fpm -s dir -t deb \
            -n korun \
            -v 0.1.8 \
            --architecture amd64 \
            --description "Gestionnaire de fichiers double panneau" \
            --maintainer "David HARPUTOGLU <kasparof57@gmail.com>" \
            -C package_root .

      - name: Générer le paquet .rpm
        run: |
          fpm -s dir -t rpm \
            -n korun \
            -v 0.1.8 \
            --architecture x86_64 \
            --description "Gestionnaire de fichiers double panneau" \
            --maintainer "David HARPUTOGLU <kasparof57@gmail.com>" \
            -C package_root .

      - name: Uploader tous les formats Linux vers GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            korun_0.1.8_amd64.deb
            korun-0.1.8-1.x86_64.rpm
            korun-v0.1.8-linux-portable.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances Python et Inno Setup
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller PyQt6 Pillow PyMuPDF python-docx openpyxl odfpy requests
          choco install innosetup -y

      - name: Compiler la version Portable Windows (.exe unique)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Korun-v0.1.8-Windows-Portable" src/main.py

      - name: Compiler le dossier d'installation Windows
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "Korun" src/main.py

      - name: Générer le script d'installation Inno Setup (.iss)
        shell: powershell
        run: |
          $issContent = @"
          [Setup]
          AppName=Körün
          AppVersion=0.1.8
          DefaultDirName={autopf}\Korun
          DefaultGroupName=Körün
          UninstallDisplayIcon={app}\Korun.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=dist
          OutputBaseFilename=Korun-v0.1.8-Windows-Setup

          [Files]
          Source: "dist\Korun\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{autoprograms}\Körün"; Filename: "{app}\Korun.exe"
          Name: "{autodesktop}\Körün"; Filename: "{app}\Korun.exe"
          "@
          Set-Content -Path "setup.iss" -Value $issContent

      - name: Compiler l'installeur Windows Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Uploader les fichiers Windows vers GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Korun-v0.1.8-Windows-Portable.exe
            dist/Korun-v0.1.8-Windows-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
