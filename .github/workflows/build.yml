name: Build and Release Körün Desktop (v0.3.0)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm clang cmake ninja-build pkg-config libgtk-3-dev
          sudo gem install --no-document fpm

      - name: Télécharger les paquets Flutter
        run: flutter pub get

      - name: Compiler pour Linux
        run: flutter build linux --release

      - name: Générer les paquets Linux (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p package_root/usr/bin
          mkdir -p package_root/opt/korun
          cp -r build/linux/x64/release/bundle/* package_root/opt/korun/
          ln -s /opt/korun/korun package_root/usr/bin/korun
          
          tar -czvf korun-v0.3.0-linux-portable.tar.gz -C build/linux/x64/release/bundle .
          fpm -s dir -t deb -n korun -v 0.3.0 --architecture amd64 -C package_root .
          fpm -s dir -t rpm -n korun -v 0.3.0 --architecture x86_64 -C package_root .

      - name: Uploader les artefacts Linux vers GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            korun_0.3.0_amd64.deb
            korun-0.3.0-1.x86_64.rpm
            korun-v0.3.0-linux-portable.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Télécharger les paquets Flutter
        run: flutter pub get

      - name: Compiler pour Windows
        run: flutter build windows --release

      - name: Créer l'archive Portable Windows
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Korun-v0.3.0-Windows-Portable.zip

      - name: Générer l'installeur Windows Setup.exe avec Inno Setup
        shell: powershell
        run: |
          $issContent = @"
          [Setup]
          AppName=Körün
          AppVersion=0.3.0
          DefaultDirName={autopf}\Korun
          DefaultGroupName=Körün
          UninstallDisplayIcon={app}\korun.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=dist
          OutputBaseFilename=Korun-v0.3.0-Windows-Setup

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{autoprograms}\Körün"; Filename: "{app}\korun.exe"
          Name: "{autodesktop}\Körün"; Filename: "{app}\korun.exe"
          "@
          Set-Content -Path "setup.iss" -Value $issContent
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Uploader les fichiers Windows vers GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Korun-v0.3.0-Windows-Portable.zip
            dist/Korun-v0.3.0-Windows-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
