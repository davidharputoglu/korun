name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (GTK + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev \
            gstreamer1.0-plugins-good

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package Linux tarball
        run: tar -czf korun-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Package Linux AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp packaging/linux/korun.desktop AppDir/usr/share/applications/korun.desktop
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/korun.png

          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -o linuxdeploy.AppImage
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage" -o linuxdeploy-plugin-gtk.AppImage
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" -o linuxdeploy-plugin-appimage.AppImage
          chmod +x linuxdeploy*.AppImage
          export PATH="$PWD:$PATH"

          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/korun.desktop \
            --icon-file assets/icon.png \
            --plugin gtk \
            --output appimage
          appimage="$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)"
          test -n "$appimage"
          mv "$appimage" "korun-${VERSION}-x86_64.AppImage"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build Debian and RPM packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          "$HOME/go/bin/nfpm" pkg --config packaging/linux/nfpm.yaml --packager deb --target .
          "$HOME/go/bin/nfpm" pkg --config packaging/linux/nfpm.yaml --packager rpm --target .

      - name: Check Linux packages
        run: |
          ls -lh korun-linux-x64.tar.gz korun-*-x86_64.AppImage korun_*.deb korun_*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            korun-linux-x64.tar.gz
            korun-*.AppImage
            korun_*.deb
            korun_*.rpm

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package Windows portable ZIP
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath korun-windows-x64-portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" packaging\windows\korun.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Check Windows packages
        shell: pwsh
        run: Get-Item korun-windows-x64-portable.zip, dist\korun-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            korun-windows-x64-portable.zip
            dist/korun-windows-x64-setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Körün v${{ needs.version.outputs.version }}
          body: |
            Release **Körün v${{ needs.version.outputs.version }}**
            - Linux x64: AppImage, Debian package (.deb), RPM package (.rpm), portable archive (.tar.gz)
            - Windows x64: installer (.exe) and portable archive (.zip)
            - Optional Linux preview dependencies: ffmpeg for video/audio thumbnails and LibreOffice for Office documents.
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
