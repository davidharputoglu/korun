name: Build and Release

on:
  push:
    tags: ['v*']

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (GTK + GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev \
            gstreamer1.0-plugins-good

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build linux --release

      # Archive créée À LA RACINE du repo, sans aucun "cd" ni "../"
      - name: Package Linux tarball
        run: tar -czf korun-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Check tarball exists
        run: ls -la korun-linux-x64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: korun-linux-x64.tar.gz

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package Windows zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath korun-windows-x64.zip

      - name: Check zip exists
        shell: pwsh
        run: Get-Item korun-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: korun-windows-x64.zip

  release:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Körün v${{ needs.version.outputs.version }}
          body: |
            Release **Körün v${{ needs.version.outputs.version }}**
            - Linux (tar.gz, x64)
            - Windows (zip, x64)
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
