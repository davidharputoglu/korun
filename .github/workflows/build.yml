name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Publish Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Installation des dépendances système Linux nécessaires pour Flutter GTK/CMake
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      # Build pour Windows
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release

      # Package le build Windows en ZIP
      - name: Compress Windows Build
        if: matrix.os == 'windows-latest'
        run: |
          powershell Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Yalin-Windows.zip

      # Build pour Linux
      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --release

      # Package le build Linux en tar.gz
      - name: Compress Linux Build
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czvf Yalin-Linux.tar.gz -C build/linux/x64/release/bundle .

      # Récupération automatique du numéro de version depuis pubspec.yaml
      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=v$VERSION" >> $GITHUB_ENV

      # Publication automatique de la release sur GitHub avec les exécutables
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ env.VERSION }}
          name: "Yalin ${{ env.VERSION }}"
          body: "Compilation automatique générée suite au Push origin."
          draft: false
          prerelease: false
          files: |
            Yalin-Windows.zip
            Yalin-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}