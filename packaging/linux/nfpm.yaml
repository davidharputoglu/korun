name: korun
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Körün contributors
description: Gestionnaire de fichiers à double panneau avec aperçu intégré.
contents:
  - src: build/linux/x64/release/bundle
    dst: /opt/korun
    type: tree
  - src: packaging/linux/korun
    dst: /usr/bin/korun
    file_info:
      mode: 0755
  - src: packaging/linux/korun.desktop
    dst: /usr/share/applications/korun.desktop
  - src: assets/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/korun.png
depends:
  - libc6
  - libgtk-3-0
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-good
overrides:
  rpm:
    depends:
      - glibc
      - gtk3
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
